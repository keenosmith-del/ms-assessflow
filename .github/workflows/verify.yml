name: Verify AssessFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: assessflow
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: assessflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U assessflow" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://assessflow:ci-only@localhost:5432/assessflow
      TEST_DATABASE_URL: postgresql+psycopg://assessflow:ci-only@localhost:5432/assessflow
      ASSESSFLOW_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: ruff check backend scripts && ruff format --check backend scripts
      - run: alembic upgrade head && python -m app.db.seed && alembic downgrade base && alembic upgrade head
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: python scripts/export_contracts.py && git diff --exit-code docs/api/openapi.json copilot/tools/connector.swagger.json
      - run: python scripts/check_secrets.py && python scripts/validate_contracts.py
      - run: az bicep build --file infra/main.bicep --outfile /tmp/assessflow.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          cd backend
          alembic upgrade head
          python -m app.db.seed
          CORS_ORIGINS=http://127.0.0.1:5175 uvicorn app.main:app --port 5050 --no-access-log &
          cd ../frontend
          VITE_API_URL=http://127.0.0.1:5050 npm run dev -- --port 5175 --strictPort &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5050/health && curl -fsS http://127.0.0.1:5175 && break; sleep 1; done
          npm run test:e2e
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
